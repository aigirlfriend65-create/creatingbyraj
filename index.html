<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শুভ জন্মদিন!</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="container">
        <div id="create-section" class="card hidden">
        <h2>আপনার জন্মদিনের উইশ তৈরি করুন</h2>
        <form id="wish-form">
            <input type="text" id="input-name" placeholder="বন্ধুর নাম লিখুন..." required>
            <input type="text" id="input-photo" placeholder="ছবির ডিরেক্ট লিংক (Image URL) দিন" required>
            <button type="submit">লিংক তৈরি করুন</button>
        </form>
        <div id="generated-link-box" class="hidden">
            <p>আপনার বিশেষ লিংকটি তৈরি হয়েছে:</p>
            <input type="text" id="final-link" readonly>
            <button id="copy-btn">লিংক কপি করুন</button>
        </div>
    </div>

        <div id="wish-section" class="card">
            <div class="photo-frame">
                <img id="birthday-photo" src="https://via.placeholder.com/150" alt="Birthday Person">
            </div>
            <h1 class="glow-text">শুভ জন্মদিন!</h1>
            <h2 id="birthday-name" class="name-title">প্রিয় বন্ধু</h2>
            <p class="wish-message">তোমার জীবনটা অনাবিল সুখ, আনন্দ এবং সাফল্যে ভরে উঠুক। আজকের দিনটি তোমার সারাজীবন মনে থাকুক!</p>
            <button id="celebrate-btn">🎉 সারপ্রাইজ দেখুন!</button>
            <button id="create-own-btn" class="secondary-btn">✨ নিজের জন্য এমন উইশ তৈরি করুন</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
