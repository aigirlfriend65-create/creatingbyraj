<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Wish</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Galaxy Space & Stars Background Canvas -->
    <canvas id="galaxy-canvas"></canvas>

    <!-- Gift Box Overlay -->
    <div id="gift-overlay" onclick="openGift()">
        <div class="gift-box">🎁</div>
        <p style="margin-top: 15px; font-size: 20px; z-index: 10; position: relative;">Tap to open your gift!</p>
    </div>

    <!-- Main Wish Content -->
    <div id="main-content">
        <div class="card">
            <!-- Circular Profile Photo -->
            <div class="profile-img-container">
                <img id="profile-img" src="my-photo.jpg" alt="Profile Photo">
            </div>

            <!-- Cake & Animation Heading -->
            <h1>🎂 Happy Birthday! 🎉</h1>
            <p style="font-size: 22px;" id="display-name">Raj Khan</p>
            
            <div class="message-box" id="display-message">
                May your life be filled with endless joy, success, and happiness. Happy Birthday!
            </div>
        </div>

        <!-- Create Your Wish Card Section -->
        <div class="creator-section">
            <h3>Create Your Own Wish Card</h3>
            <div class="form-group">
                <label>Enter Your Name:</label>
                <input type="text" id="input-name" placeholder="Type your name here">
            </div>
            <div class="form-group">
                <label>Enter Your Message:</label>
                <textarea id="input-message" rows="3" placeholder="Type your custom message here"></textarea>
            </div>
            <div class="form-group">
                <label>Photo URL (Direct Image Link):</label>
                <input type="text" id="input-photo-url" placeholder="Paste direct image link">
            </div>
            <button class="btn-create" onclick="generateWish()">Create Wish Link</button>

            <!-- Generated Link Box with Copy Button -->
            <div id="link-result-box" style="display:none; margin-top: 15px;">
                <label style="font-size: 13px; color: #fff; font-weight: bold;">Your Generated Link:</label>
                <input type="text" id="generated-link-input" readonly style="margin-top: 5px; background: rgba(255,255,255,0.8); color: #000;">
                <button onclick="copyLink()" style="margin-top: 8px; background: #ff416c; color: white; border: none; padding: 8px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold;">Copy Link</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
