<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Wish</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            color: #333;
            text-align: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 50px;
        }
        /* Gift Box Opening Screen with 2 Seconds Animation Effect */
        #gift-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        .gift-box {
            font-size: 90px;
            cursor: pointer;
            animation: bounce 1.2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0) scale(1);}
            40% {transform: translateY(-35px) scale(1.1);}
            60% {transform: translateY(-18px) scale(1.05);}
        }
        #gift-screen p {
            color: #fff;
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Main Content Container */
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            display: none;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            padding: 30px 20px;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
        }
        h1 {
            color: #ff4757;
            font-size: 30px;
            margin-bottom: 15px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        /* Round Profile Photo at the Center */
        .profile-container {
            width: 140px;
            height: 140px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            border: 5px solid #ff4757;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            background: #eee;
        }
        .profile-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* Decorations (Cake, Firecrackers, etc.) */
        .decorations {
            font-size: 30px;
            margin: 15px 0;
            animation: shake 1s infinite alternate;
        }
        @keyframes shake {
            0% { transform: rotate(-3deg); }
            100% { transform: rotate(3deg); }
        }

        .message-box {
            font-size: 18px;
            color: #444;
            background: #fff5f5;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 5px solid #ff4757;
            line-height: 1.5;
        }
        .sender-name {
            font-weight: bold;
            color: #2ed573;
            font-size: 20px;
            margin-top: 10px;
        }

        /* Wish Creator Section */
        .creator-section {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            padding: 25px 20px;
            margin-top: 30px;
            text-align: left;
        }
        .creator-section h2 {
            font-size: 22px;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }
