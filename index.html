<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 🎂</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
    <!-- Three.js for 3D Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>

    <!-- 3D Canvas Background -->
    <div id="canvas-container"></div>

    <!-- 1. Gift Box Opening Screen -->
    <div id="gift-overlay" class="gift-overlay">
        <div class="gift-box-container" id="open-gift-btn">
            <div class="gift-box">🎁</div>
            <p>Tap to Open Your Gift! ✨</p>
        </div>
    </div>

    <!-- Main Content Container -->
    <div class="container main-content hidden" id="main-content">
        
        <!-- Wish Card Section -->
        <div class="card">
            <div class="photo-frame">
                <img id="birthday-photo" src="https://via.placeholder.com/150" alt="Birthday Person">
            </div>
            <h1 class="glow-text">Happy Birthday! 🎂</h1>
            <h2 id="birthday-name" class="name-title">Dear Friend</h2>
            <p id="wish-message" class="wish-message"></p>
            <div class="celebration-icons">🎆 🥳 🎈 🎇</div>
            <button id="celebrate-btn">🎉 Celebrate with Fireworks!</button>
        </div>

        <!-- Scroll Down Section to Create Own Wish -->
        <div class="create-card-section">
            <h2>✨ Create Your Own Wish Card ✨</h2>
            <form id="wish-form">
                <div class="input-group">
                    <label>Enter Your Name / Friend's Name:</label>
                    <input type="text" id="input-name" placeholder="e.g. Sajidur Rahaman" required>
                </div>

                <div class="input-group">
                    <label>Enter Custom Wish Message:</label>
                    <textarea id="input-custom-msg" placeholder="Write your special birthday message here..." rows="3" required></textarea>
                </div>
                
                <div class="input-group">
                    <label>Upload Your Photo:</label>
                    <input type="file" id="input-photo" accept="image/*" required>
                </div>

                <button type="submit" class="generate-btn">🚀 Create Wish Link</button>
            </form>

            <div id="generated-link-box" class="hidden">
                <p>Your special link is ready! Share it now:</p>
                <input type="text" id="final-link" readonly>
                <button id="copy-btn" class="copy-btn">📋 Copy Link</button>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
